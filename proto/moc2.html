</head>

// ---- particles ----
const spark = (x, y, n, cols, sp = 200, life = 0.8, sz = 4, grav = 0) => { for (let i = 0; i < n; i++) { const a = Math.random() * 6.28, v = sp * (0.3 + Math.random()); parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, l: life * (0.5 + Math.random() * 0.5), L: life, c: cols[i % cols.length], s: sz * (0.5 + Math.random()), grav }); } };

// an aura of rising energy round the player, ring pulses on the ground, crackles
function aura(l, k, cols) { const cx = l.px, cy = l.ground - l.ph * 0.5, r = l.ph * (0.45 + k * 0.4);
  g.globalCompositeOperation = 'lighter'; const gr = g.createRadialGradient(cx, cy, 0, cx, cy, r * 1.4); gr.addColorStop(0, cols[1] + 'aa'); gr.addColorStop(0.4, cols[0] + '66'); gr.addColorStop(1, cols[0] + '00'); g.fillStyle = gr; g.globalAlpha = 0.4 + k * 0.6; g.beginPath(); g.ellipse(cx, cy, r * 1.4 * 0.7, r * 1.4, 0, 0, 7); g.fill();

}
// the beam or the fire carried on past the edge of the animation, out to the goal

  else if (st === 'choose') { sheetFrame(P.turn, P.tn, 0, l.px, l.ground, l.ph); drawBall(l.px + l.ph * 0.32, l.ground - l.ph * 0.07, l.ph * 0.07, 0); aura(l, 0.1 + Math.sin(now * 4) * 0.05, ['#ffffff', '#ffffff', '#c8d8ff']); }
  else if (st === 'charge') { const k = Math.min(1, e / 1.6); const jit = k * 4; sheetFrame(P.turn, P.tn, 0, l.px + (Math.random() - 0.5) * jit, l.ground, l.ph * (1 + k * 0.08)); drawBall(l.px + l.ph * 0.32, l.ground - l.ph * 0.07, l.ph * 0.07, 0); aura(l, k, pw.col);
    if (Math.random() < 0.3) tone(200 + k * 600, 300 + k * 900, 0.08, 'sawtooth', 0.02);
    if (e > 1.6) { flash = 0.5; shake = 0.3; spark(l.px, l.ground - l.ph * 0.5, 60, pw.col.concat('#ffffff'), W * 0.45, 0.9, 6); noise(0.6, 0.12, 2000); tone(120, 40, 0.6, 'sawtooth', 0.08); fx = { m: power, t: now }; setState('emerge'); } }
  else if (st === 'emerge') { const F = FX[power], fi = (now - fx.t) / F.dt;
    // the player is swallowed by the fire / the plates; the creature shows up inside the effect
    if (fi < 2) { g.globalAlpha = 1 - fi / 2; sheetFrame(P.turn, P.tn, 0, l.px, l.ground, l.ph); g.globalAlpha = 1; }
    if (power === 'smok' && fi >= F.appear) { g.save(); g.globalAlpha = Math.min(1, (fi - F.appear) / 3); powerFrame(pw, 0, l); g.restore(); }
    if (fi >= 6 && power === 'smok' && !fx.boom) { fx.boom = 1; shake = 0.25; noise(0.5, 0.1, 900); }
    if (power === 'robot' && fi >= F.appear) { setState('transform'); flash = 0.7; shake = 0.4; noise(0.8, 0.14, 2500); }
    if (power === 'smok' && fi >= F.n - 0.5) setState('transform'); }
  else if (st === 'transform' || st === 'fire') { let fi = e * pw.fps; if (fi >= pw.hit && st === 'transform') { setState('fire'); ball = { x: 0, y: 0, u: 0, spin: 0 }; noise(1.6, 0.1, power === 'robot' ? 3000 : 900); tone(power === 'robot' ? 900 : 200, power === 'robot' ? 300 : 80, 1.2, 'sawtooth', 0.05); }
    if (st === 'fire') { const fe = now - t0, span = pw.loop[1] - pw.loop[0] + 1, base = pw.hit + fe * pw.fps; fi = base < pw.loop[0] ? base : pw.loop[0] + ((base - pw.loop[0]) % span); }
    if (st === 'transform' && e < 0.5) aura(l, 1 - e * 2, pw.col);
    if (fx && power === 'smok') drawFx(l);
    const f = powerFrame(pw, Math.min(fi, pw.n - 1), l); if (st === 'transform') bolt(f, l, fi);
    if (fx && power === 'robot') drawFx(l);
    if (st === 'fire' && f) { const fe = now - t0; beam = Math.min(1, fe / 0.35); const s = stream(f, l, beam, pw.col);
      ball.u = Math.min(1, Math.max(0, (fe - 0.2) / 0.7)); const bx = f.ex + (l.goal + W * 0.035 - f.ex) * ball.u, by = f.ey + (l.ground - l.ph * 0.5 - f.ey) * ball.u; ball.spin += dt * 30;
      if (fe > 0.2) { drawBall(bx, by, l.ph * 0.09, ball.spin); spark(bx - 10, by, 2, pw.col, 80, 0.4, 5); }
      if (ball.u >= 1 && !ball.hit) { ball.hit = true; net = 1; shake = 0.5; flash = 0.6; spark(l.goal + W * 0.03, l.ground - l.ph * 0.5, 140, pw.col.concat(['#ffffff', '#ffe14a']), W * 0.6, 1.4, 7, 300); noise(1, 0.16, 1500); [523, 659, 784, 1046].forEach((fq, i) => setTimeout(() => tone(fq, fq, 0.2, 'square', 0.05), i * 110)); msg = 'GOOOL!'; msgT = 2.4; }
      if (fe > 2.4) { setState('back'); noise(0.8, 0.1, 2500); tone(300, 1200, 0.5, 'triangle', 0.06); } } }
  else if (st === 'back') { const k = Math.min(1, e / 1.3);
    // the creature breaks up into glitches, a flicker swaps it for the player, then the player's glitch settles
    if (k < 0.5) { const amt = 0.2 + k * 1.6; glitchDraw(() => powerFrame(pw, pw.loop[0] + ((e * 12) % 2 | 0), l), amt); if (Math.random() < 0.3) tone(200 + Math.random() * 1500, 100, 0.05, 'square', 0.03); }
    else { const amt = Math.max(0, 1 - (k - 0.5) * 2); if (!ball.back) { ball.back = true; flash = 0.35; noise(0.25, 0.1, 4000); tone(1200, 300, 0.25, 'square', 0.05); } glitchDraw(() => sheetFrame(P.turn, P.tn, 0, l.px, l.ground, l.ph), amt); if (amt > 0.2 && Math.random() < 0.3) tone(300 + Math.random() * 1500, 120, 0.04, 'square', 0.03); }
    if (e > 2.2) setState('done'); }
  else if (st === 'done') sheetFrame(P.turn, P.tn, 0, l.px, l.ground, l.ph);
  if (st === 'emerge') drawFx(l);
  goalFront(l); net = Math.max(0, net - dt * 0.8);
  drawParts(dt);
  if (msgT > 0) { msgT -= dt; const s = Math.max(16, Math.min(W, H) * 0.1) * (1 + Math.max(0, msgT - 2.1) * 2); g.font = `${s | 0}px "Press Start 2P"`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = '#000'; g.fillText(msg, W / 2 + 5, H * 0.3 + 5); g.fillStyle = Math.floor(now * 8) % 2 ? '#ffe14a' : '#ffffff'; g.fillText(msg, W / 2, H * 0.3); }
  g.restore();
  if (flash > 0) { g.fillStyle = `rgba(255,255,255,${flash})`; g.fillRect(0, 0, W, H); flash -= dt * 2.2; }
}
restart(); requestAnimationFrame(frame);
window.MOC = { pick: (m) => { power = m; setState('charge'); }, get st() { return st; } };
})();
</script>
